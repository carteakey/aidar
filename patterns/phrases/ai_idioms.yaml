id: ai_idioms
version: 2
name: AI Vocabulary Idioms
description: >
  Phrases corroborated as LLM-associated by the sources this project tracks:
  Wikipedia "Signs of AI writing" words-to-watch (revision 1384930421),
  humanizer v4.0.0 section 12 ("Overused AI words"), declauding v0.14.0
  declaude_lint.py ("slop vocabulary"), and arXiv:2412.11385 (21 focal words
  overrepresented in LLM output). v2 drops every term none of these
  corroborates (game changer, paradigm shift, cutting-edge, state-of-the-art,
  key takeaway, the bottom line, holistic, actionable, multifaceted kept only
  per Wikipedia, ever-evolving, ever-changing, bare 'in today's', bare
  'navigating') — per humanizer section 12, "a formal word outside these lists
  is not a tell by itself". Caveats carried over from the sources: humanizer
  keeps technical uses of 'robust' and treats 'landscape'/'tapestry' as tells
  only as abstract nouns; a frequency matcher cannot check those conditions, so
  their single-word contribution stays small. Whole-word matching (v2's
  match_mode) additionally stops 'utilize' firing inside 'utilized' and
  'discern'/'thus' inside unrelated words.
category: phrases
weight: 0.85
detection_type: frequency
severity: high
references:
  - https://arxiv.org/abs/2412.11385
  - https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
  - https://github.com/blader/humanizer
  - https://github.com/oaustegard/claude-skills/tree/main/declauding
params:
  terms:
    - "delve into"
    - "delves into"
    - "delving into"
    - "deep dive"
    - "dive deep"
    - "at its core"
    - "at the end of the day"
    - "leverage"
    - "utilize"
    - "fostering"
    - "robust"
    - "showcase"
    - "seamless"
    - "seamlessly"
    - "realm of"
    - "embark on"
    - "navigate the complexities"
    - "in today's fast-paced"
    - "synergy"
    - "multifaceted"
    - "nuanced"
    - "streamline"
    - "transformative"
    - "tapestry"
    - "testament to"
    - "the landscape of"
  match_mode: word_boundary
  per_n_words: 1000
  threshold_low: 2.0
  threshold_high: 15.0
