id: filler_openers
version: 2
name: Filler Opener Phrases
description: >
  AI models frequently open paragraphs and responses with filler phrases that
  signal a structured, templated response. "Overall", "in essence", and
  "ultimately" appear at the start of paragraphs at abnormally high rates
  compared to human-written editorial content. v2: conclusion signposts
  ("in conclusion", "to sum up", "in summary", ...) moved to the dedicated
  signposted_conclusion pattern.
category: phrases
weight: 0.75
detection_type: frequency
severity: high
params:
  terms:
    - "in essence"
    - "overall"
    - "ultimately"
    - "in short"
    - "in brief"
    - "to put it simply"
    - "put simply"
    - "simply put"
    - "as a final note"
    - "final thoughts"
  match_mode: contains
  per_n_words: 1000
  threshold_low: 1.0
  threshold_high: 8.0
