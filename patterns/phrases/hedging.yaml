id: hedging_phrases
version: 3
name: Hedging Language Cluster
description: >
  LLMs carry RLHF politeness scaffolding into prose: "it's worth noting",
  "it is important to note", "I'd be happy to", "feel free to", "rest assured".
  These stacked, service-frame constructions are the signal — v3 removes the
  plain emphatic markers (certainly, absolutely, of course, honestly, genuinely,
  to be fair...) because ordinary hedges are human habits, not tells:
  humanizer v4.0.0 ("Keep a qualifier only when the source supports it and the
  meaning needs it. Ordinary hedges such as perhaps or tends to are human
  habits and not tells. Weak alone."), and declauding v0.14.0 flags only
  STACKED hedges ("could potentially", "might arguably" — declaude_lint.py
  "stacked hedges — one carries the uncertainty"). In the author corpus, 5 of
  the 15 removed terms fire on human posts (absolutely on 3 posts, genuinely
  on 5, honestly on 2), confirming them as false-positive risk; no removed
  term appears in the humanizer/Wikipedia/declauding watch lists.
category: phrases
weight: 0.90
detection_type: frequency
severity: high
references:
  - https://github.com/blader/humanizer
  - https://github.com/oaustegard/claude-skills/tree/main/declauding
params:
  terms:
    - "it's worth noting"
    - "it is worth noting"
    - "it's important to note"
    - "it is important to note"
    - "it's important to"
    - "it is important to"
    - "it's crucial to"
    - "it is crucial to"
    - "it should be noted"
    - "please note that"
    - "needless to say"
    - "it goes without saying"
    - "as you can see"
    - "i'd be happy to"
    - "i would be happy to"
    - "feel free to"
    - "don't hesitate to"
    - "rest assured"
  match_mode: word_boundary
  per_n_words: 1000
  threshold_low: 1.5
  threshold_high: 12.0
