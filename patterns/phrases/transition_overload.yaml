id: transition_overload
version: 2
name: Transition Word Overload
description: >
  Wikipedia's "Signs of AI writing" (revision 1384930421) names the transition
  words actually observed to be overused by LLMs — "Additionally, Consequently,
  and Notably, often to begin sentences" — and explicitly notes that "only a
  few transition words and phrases are known to be overused by AI in this way.
  This pattern also has precedence in essay-like writing by humans and is
  accepted by many style guides, so this is not a strong tell." v2 therefore
  (a) restricts terms to those three corroborated words and (b) lowers the
  weight 0.70 -> 0.35 per that "not a strong tell" finding. The 20 removed
  terms (furthermore, moreover, however, for example, for instance, as a
  result, in other words, ...) appear in none of the watch lists this project
  tracks — humanizer v4.0.0 section 12: "A formal word outside these lists is
  not a tell by itself" — and they fired on human posts in the author corpus
  (17.6% of human docs) while never firing on the AI-labelled ones, i.e. they
  measured ordinary human connective use, not AI style.
category: phrases
weight: 0.35
detection_type: frequency
severity: low
references:
  - https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
  - https://github.com/blader/humanizer
params:
  terms:
    - "additionally"
    - "consequently"
    - "notably"
  match_mode: word_boundary
  per_n_words: 1000
  threshold_low: 1.0
  threshold_high: 6.0
