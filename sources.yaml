# External sources aidar's patterns and README draw on.
#
# One entry per upstream. `pinned` is what this repo currently reflects; the
# checker (scripts/check_upstreams.py) compares it against upstream and
# reports drift. It never edits anything: merging an upstream change is a
# judgment call — update `pinned` only after reviewing the new revision.
#
# kind:
#   git-tag   - a repo with release tags; `tag_prefix` filters monorepo tags
#   gist      - a GitHub gist; pinned is its `updated_at` timestamp
#   wikipedia - a wiki page; pinned is its revision id (MediaWiki API)
#   paper     - an academic paper (arXiv id / DOI); never drift-checked
#   web       - a web page; never drift-checked
#
# derived_patterns: pattern ids in patterns/ whose `references:` field cites
# this source. Credit-only sources (no pattern yet) carry an empty list.

